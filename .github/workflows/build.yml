name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: flutter create --platforms=android --org com.aura --project-name aura_player .

      - name: Apply Aura Android files (manifest, widget, service)
        run: cp -r android_overlay/. android/

      - name: Get packages
        run: flutter pub get

      - name: Patch old plugins (compileSdk and namespace)
        run: |
          for F in $HOME/.pub-cache/hosted/pub.dev/*/android/build.gradle; do
            [ -f "$F" ] || continue
            sed -i -E 's/^([[:space:]]*)compileSdk(Version)?[[:space:]]*=?[[:space:]]*([0-9]|[12][0-9]|3[0-3])[[:space:]]*$/\1compileSdkVersion 36/' "$F"
          done
          F=$(ls -d $HOME/.pub-cache/hosted/pub.dev/on_audio_query_forked-*/android/build.gradle 2>/dev/null | head -1)
          if [ -n "$F" ] && ! grep -q "namespace" "$F"; then
            sed -i "s/^android {/android {\n    namespace 'com.lucasjosino.on_audio_query'/" "$F"
          fi
          grep -rn "compileSdk" $HOME/.pub-cache/hosted/pub.dev/on_audio_query*/android/build.gradle || true

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: aura-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release (download from phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aura build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
